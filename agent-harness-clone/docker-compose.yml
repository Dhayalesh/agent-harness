# Local MongoDB for the agent platform (`npm run platform`).
# No authentication is configured, so this is for LOCAL DEVELOPMENT ONLY.
# Do not expose this port publicly or use it in production.
#
#   docker compose up -d       # start MongoDB in the background
#   docker compose down        # stop it (data is kept in the named volume)
#   docker compose down -v     # stop and delete all data
#
# Matches PLATFORM_MONGODB_URI=mongodb://127.0.0.1:27017/trueai_agent_platform
# from .env / .env.example.

services:
  mongodb:
    image: mongo:7
    container_name: agent-harness-mongodb
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongodb-data:

version: 0.2

env:
  shell: bash
  variables:
    AWS_PAGER: ""
    AWS_DEFAULT_OUTPUT: json
    DOCKER_BUILDKIT: "1"
    AWS_REGION: "us-east-1"
    ECR_REGISTRY: "498341975048.dkr.ecr.us-east-1.amazonaws.com"
    ECR_REPOSITORY: "agentcore"
    AGENTCORE_RUNTIME_ID: "agent_harness-Jax4VH7YQj"

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - |
        set -euo pipefail

        echo "=========================================="
        echo "INSTALL"
        echo "=========================================="

        command -v aws >/dev/null || { echo "ERROR: AWS CLI missing" >&2; exit 1; }
        command -v docker >/dev/null || { echo "ERROR: Docker missing" >&2; exit 1; }
        command -v python3 >/dev/null || { echo "ERROR: Python 3 missing" >&2; exit 1; }

        APP_DIR="${CODEBUILD_SRC_DIR}/agent-harness-clone"

        if [[ ! -d "$APP_DIR" ]]; then
          echo "ERROR: Application directory does not exist: $APP_DIR" >&2
          exit 1
        fi

        cd "$APP_DIR"

        [[ -f package.json ]] || { echo "ERROR: package.json missing" >&2; exit 1; }
        [[ -f package-lock.json ]] || { echo "ERROR: package-lock.json missing" >&2; exit 1; }

        echo "Node: $(node --version)"
        echo "npm: $(npm --version)"
        echo "Docker: $(docker --version)"

        npm ci --no-audit --no-fund

        echo "INSTALL completed successfully."

  pre_build:
    commands:
      - |
        set -euo pipefail

        echo "=========================================="
        echo "PRE_BUILD"
        echo "=========================================="

        APP_DIR="${CODEBUILD_SRC_DIR}/agent-harness-clone"
        cd "$APP_DIR"

        : "${AWS_REGION:?AWS_REGION is required}"
        : "${ECR_REGISTRY:?ECR_REGISTRY is required}"
        : "${ECR_REPOSITORY:?ECR_REPOSITORY is required}"
        : "${AGENTCORE_RUNTIME_ID:?AGENTCORE_RUNTIME_ID is required}"
        : "${CODEBUILD_RESOLVED_SOURCE_VERSION:?CODEBUILD_RESOLVED_SOURCE_VERSION is required}"

        IMAGE_TAG="$(printf '%s' "$CODEBUILD_RESOLVED_SOURCE_VERSION" | tr '[:upper:]' '[:lower:]')"
        IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

        echo "Region: $AWS_REGION"
        echo "Image: $IMAGE_URI"
        echo "Runtime ID: $AGENTCORE_RUNTIME_ID"

        echo "Running typecheck..."
        npm run typecheck

        echo "Running tests..."
        npm test

        echo "Running application build..."
        npm run build

        echo "Checking AWS identity..."
        aws sts get-caller-identity --region "$AWS_REGION"

        echo "Checking ECR repository..."
        aws ecr describe-repositories \
          --region "$AWS_REGION" \
          --repository-names "$ECR_REPOSITORY" \
          --output json

        echo "Logging in to ECR..."
        aws ecr get-login-password --region "$AWS_REGION" | \
          docker login --username AWS --password-stdin "$ECR_REGISTRY"

        echo "Installing ARM64 emulation..."
        docker run --privileged --rm \
          tonistiigi/binfmt:latest \
          --install arm64

        echo "Testing ARM64 emulation..."
        ARCH="$(docker run --rm --platform linux/arm64 arm64v8/alpine:latest uname -m)"
        echo "Architecture returned by ARM64 test: $ARCH"

        if [[ "$ARCH" != "aarch64" ]]; then
          echo "ERROR: ARM64 emulation test failed." >&2
          exit 1
        fi

        echo "PRE_BUILD completed successfully."

  build:
    commands:
      - |
        set -euo pipefail

        echo "=========================================="
        echo "BUILD / DEPLOY"
        echo "=========================================="

        APP_DIR="${CODEBUILD_SRC_DIR}/agent-harness-clone"
        cd "$APP_DIR"

        IMAGE_TAG="$(printf '%s' "$CODEBUILD_RESOLVED_SOURCE_VERSION" | tr '[:upper:]' '[:lower:]')"
        IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

        echo "Building ARM64 image..."
        echo "Image: $IMAGE_URI"

        if ! docker build \
          --platform linux/arm64 \
          --tag "$IMAGE_URI" \
          .; then
          echo "ERROR: Docker ARM64 build failed." >&2
          exit 1
        fi

        IMAGE_PLATFORM="$(docker image inspect "$IMAGE_URI" --format '{{.Os}}/{{.Architecture}}')"
        echo "Built image platform: $IMAGE_PLATFORM"

        if [[ "$IMAGE_PLATFORM" != "linux/arm64" ]]; then
          echo "ERROR: Expected linux/arm64, got $IMAGE_PLATFORM" >&2
          exit 1
        fi

        echo "Pushing image..."
        docker push "$IMAGE_URI"

        echo "Reading ECR digest..."
        IMAGE_DIGEST="$(
          aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text
        )"

        if [[ "$IMAGE_DIGEST" != sha256:* ]]; then
          echo "ERROR: Invalid ECR digest: $IMAGE_DIGEST" >&2
          exit 1
        fi

        echo "Image digest: $IMAGE_DIGEST"

        TMP_DIR="$(mktemp -d)"
        trap 'rm -rf "$TMP_DIR"' EXIT

        CURRENT="$TMP_DIR/current.json"
        REQUEST="$TMP_DIR/request.json"
        RESPONSE="$TMP_DIR/response.json"

        echo "Getting existing AgentCore Runtime..."

        if ! aws bedrock-agentcore-control get-agent-runtime \
          --region "$AWS_REGION" \
          --agent-runtime-id "$AGENTCORE_RUNTIME_ID" \
          --output json > "$CURRENT"; then
          echo "ERROR: GetAgentRuntime failed." >&2
          exit 1
        fi

        echo "Existing runtime retrieved."

        echo "Creating minimal UpdateAgentRuntime request..."

        python3 - "$CURRENT" "$REQUEST" "$AGENTCORE_RUNTIME_ID" "$IMAGE_URI" <<'PY'
        import hashlib
        import json
        import sys
        
        current_file, request_file, runtime_id, image_uri = sys.argv[1:5]
        
        with open(current_file, encoding="utf-8") as f:
            current = json.load(f)
        
        role_arn = current.get("roleArn")
        network = current.get("networkConfiguration") or {}
        
        if not role_arn:
            raise SystemExit("ERROR: Existing runtime has no roleArn")
        
        network_mode = network.get("networkMode")
        if not network_mode:
            raise SystemExit("ERROR: Existing runtime has no networkConfiguration.networkMode")
        
        request = {
            "agentRuntimeId": runtime_id,
            "agentRuntimeArtifact": {
        "containerConfiguration": {
            "containerUri": image_uri
        }
            },
            "networkConfiguration": {
        "networkMode": network_mode
            },
            "roleArn": role_arn,
            "clientToken": "cb-" + hashlib.sha256(
        f"{runtime_id}:{image_uri}".encode("utf-8")
            ).hexdigest()[:32]
        }
        
        with open(request_file, "w", encoding="utf-8") as f:
            json.dump(request, f, separators=(",", ":"))
        
        print("Minimal UpdateAgentRuntime request created.")
        print("Runtime ID:", runtime_id)
        print("Role ARN:", role_arn)
        print("Network mode:", network_mode)
        print("Image:", image_uri)
        PY

        echo "Validating request JSON..."

        python3 - "$REQUEST" "$IMAGE_URI" "$AGENTCORE_RUNTIME_ID" <<'PY'
        import json
        import sys
        
        request_file, expected_image, expected_runtime_id = sys.argv[1:4]
        
        with open(request_file, encoding="utf-8") as f:
            data = json.load(f)
        
        required = (
            "agentRuntimeId",
            "agentRuntimeArtifact",
            "networkConfiguration",
            "roleArn",
        )
        
        missing = [field for field in required if not data.get(field)]
        if missing:
            raise SystemExit("ERROR: Missing required fields: " + ", ".join(missing))
        
        if data["agentRuntimeId"] != expected_runtime_id:
            raise SystemExit("ERROR: agentRuntimeId mismatch")
        
        container = data["agentRuntimeArtifact"].get("containerConfiguration", {})
        if container.get("containerUri") != expected_image:
            raise SystemExit("ERROR: containerUri mismatch")
        
        network_mode = data["networkConfiguration"].get("networkMode")
        if network_mode not in ("PUBLIC", "VPC"):
            raise SystemExit("ERROR: Unsupported networkMode: " + str(network_mode))
        
        if not data["roleArn"].startswith("arn:aws:iam::"):
            raise SystemExit("ERROR: Invalid roleArn")
        
        print("UpdateAgentRuntime request validation passed.")
        PY

        echo "UpdateAgentRuntime request:"
        python3 -m json.tool "$REQUEST"

        echo "Calling UpdateAgentRuntime..."

        if ! aws bedrock-agentcore-control update-agent-runtime \
          --region "$AWS_REGION" \
          --cli-input-json "file://$REQUEST" \
          --output json > "$RESPONSE"; then

          echo "==========================================" >&2
          echo "ERROR: UpdateAgentRuntime FAILED" >&2
          echo "==========================================" >&2
          echo "Request sent:" >&2
          python3 -m json.tool "$REQUEST" >&2
          echo "Current runtime:" >&2
          python3 -m json.tool "$CURRENT" >&2
          exit 1
        fi

        echo "UpdateAgentRuntime response:"
        python3 -m json.tool "$RESPONSE"

        NEW_RUNTIME_VERSION="$(
          python3 - "$RESPONSE" <<'PY'
        import json
        import sys
        
        with open(sys.argv[1], encoding="utf-8") as f:
            response = json.load(f)
        
        version = response.get("agentRuntimeVersion")
        
        if version is None:
            raise SystemExit(
                "ERROR: UpdateAgentRuntime response did not contain agentRuntimeVersion"
            )
        
        print(version)
        PY
        )"
        
        echo "New Runtime Version: $NEW_RUNTIME_VERSION"
        
        if [[ ! "$NEW_RUNTIME_VERSION" =~ ^[1-9][0-9]*$ ]]; then
          echo "ERROR: Invalid runtime version: $NEW_RUNTIME_VERSION" >&2
          exit 1
        fi
        
        echo "Waiting for Runtime to become READY..."
        
        RUNTIME_STATUS=""
        
        for attempt in $(seq 1 120); do
          RUNTIME_JSON="$(
            aws bedrock-agentcore-control get-agent-runtime \
              --region "$AWS_REGION" \
              --agent-runtime-id "$AGENTCORE_RUNTIME_ID" \
              --agent-runtime-version "$NEW_RUNTIME_VERSION" \
              --output json
          )"
        
          RUNTIME_STATUS="$(
            printf '%s' "$RUNTIME_JSON" |
              python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))'
          )"
        
          echo "Attempt $attempt/120 - Runtime status: $RUNTIME_STATUS"
        
          if [[ "$RUNTIME_STATUS" == "READY" ]]; then
            break
          fi
        
          case "$RUNTIME_STATUS" in
            CREATE_FAILED|UPDATE_FAILED)
              echo "ERROR: Runtime deployment failed." >&2
              echo "$RUNTIME_JSON" >&2
              exit 1
              ;;
          esac
        
          sleep 5
        done
        
        if [[ "$RUNTIME_STATUS" != "READY" ]]; then
          echo "ERROR: Runtime did not become READY within timeout." >&2
          exit 1
        fi
        
        echo "Runtime is READY."
        
        DEPLOYED_URI="$(
          aws bedrock-agentcore-control get-agent-runtime \
            --region "$AWS_REGION" \
            --agent-runtime-id "$AGENTCORE_RUNTIME_ID" \
            --agent-runtime-version "$NEW_RUNTIME_VERSION" \
            --query 'agentRuntimeArtifact.containerConfiguration.containerUri' \
            --output text
        )"
        
        echo "Expected image: $IMAGE_URI"
        echo "Deployed image: $DEPLOYED_URI"
        
        if [[ "$DEPLOYED_URI" != "$IMAGE_URI" ]]; then
          echo "ERROR: AgentCore deployed image does not match ECR image." >&2
          exit 1
        fi
        
        echo "Waiting for DEFAULT endpoint..."
        
        ENDPOINT_STATUS=""
        LIVE_VERSION=""
        
        for attempt in $(seq 1 120); do
          ENDPOINT_JSON="$(
            aws bedrock-agentcore-control get-agent-runtime-endpoint \
              --region "$AWS_REGION" \
              --agent-runtime-id "$AGENTCORE_RUNTIME_ID" \
              --endpoint-name DEFAULT \
              --output json
          )"
        
          ENDPOINT_STATUS="$(
            printf '%s' "$ENDPOINT_JSON" |
              python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))'
          )"
        
          LIVE_VERSION="$(
            printf '%s' "$ENDPOINT_JSON" |
              python3 -c 'import json,sys; print(json.load(sys.stdin).get("liveVersion",""))'
          )"
        
          echo "Attempt $attempt/120"
          echo "Endpoint status: $ENDPOINT_STATUS"
          echo "Live version: $LIVE_VERSION"
        
          if [[ "$ENDPOINT_STATUS" == "READY" &&
                "$LIVE_VERSION" == "$NEW_RUNTIME_VERSION" ]]; then
            break
          fi
        
          case "$ENDPOINT_STATUS" in
            CREATE_FAILED|UPDATE_FAILED|DELETING)
              echo "ERROR: DEFAULT endpoint failed." >&2
              echo "$ENDPOINT_JSON" >&2
              exit 1
              ;;
          esac
        
          sleep 5
        done
        
        if [[ "$ENDPOINT_STATUS" != "READY" ||
              "$LIVE_VERSION" != "$NEW_RUNTIME_VERSION" ]]; then
          echo "ERROR: DEFAULT endpoint did not reach the new runtime version." >&2
          exit 1
        fi
        
        echo "=========================================="
        echo "DEPLOYMENT SUCCESSFUL"
        echo "=========================================="
        echo "Image          : $IMAGE_URI"
        echo "Digest         : $IMAGE_DIGEST"
        echo "Runtime ID     : $AGENTCORE_RUNTIME_ID"
        echo "Runtime Version: $NEW_RUNTIME_VERSION"
        echo "Runtime Status : $RUNTIME_STATUS"
        echo "Endpoint       : DEFAULT"
        echo "Endpoint Status: $ENDPOINT_STATUS"
        echo "Live Version   : $LIVE_VERSION"
        echo "=========================================="
        
          post_build:
            commands:
              - echo "POST_BUILD completed."

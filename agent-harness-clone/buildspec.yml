version: 0.2

env:
  shell: bash
  variables:
    AWS_PAGER: ""
    AWS_DEFAULT_OUTPUT: json
    DOCKER_BUILDKIT: "1"
    AWS_REGION: "us-east-1"
    ECR_REGISTRY: "498341975048.dkr.ecr.us-east-1.amazonaws.com"
    ECR_REPOSITORY: "agentcore"
    AGENTCORE_RUNTIME_ID: "agent_harness-Jax4VH7YQj"

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - |
        set -euo pipefail
        echo "========== INSTALL =========="

        command -v aws >/dev/null || { echo "ERROR: AWS CLI missing"; exit 1; }
        command -v docker >/dev/null || { echo "ERROR: Docker missing"; exit 1; }
        command -v jq >/dev/null || { echo "ERROR: jq missing"; exit 1; }

        APP_DIR="${CODEBUILD_SRC_DIR}/agent-harness-clone"
        [[ -d "$APP_DIR" ]] || { echo "ERROR: $APP_DIR not found"; exit 1; }

        cd "$APP_DIR"
        [[ -f package.json ]] || { echo "ERROR: package.json missing"; exit 1; }
        [[ -f package-lock.json ]] || { echo "ERROR: package-lock.json missing"; exit 1; }

        npm ci --no-audit --no-fund

        echo "INSTALL SUCCESS"

  pre_build:
    commands:
      - |
        set -euo pipefail
        echo "========== PRE_BUILD =========="

        APP_DIR="${CODEBUILD_SRC_DIR}/agent-harness-clone"
        cd "$APP_DIR"

        : "${AWS_REGION:?AWS_REGION is required}"
        : "${ECR_REGISTRY:?ECR_REGISTRY is required}"
        : "${ECR_REPOSITORY:?ECR_REPOSITORY is required}"
        : "${AGENTCORE_RUNTIME_ID:?AGENTCORE_RUNTIME_ID is required}"
        : "${CODEBUILD_RESOLVED_SOURCE_VERSION:?CODEBUILD_RESOLVED_SOURCE_VERSION is required}"

        IMAGE_TAG="$(printf '%s' "$CODEBUILD_RESOLVED_SOURCE_VERSION" | tr '[:upper:]' '[:lower:]')"
        IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

        echo "IMAGE_URI=$IMAGE_URI"
        echo "AGENTCORE_RUNTIME_ID=$AGENTCORE_RUNTIME_ID"

        echo "===== TYPECHECK ====="
        npm run typecheck

        echo "===== TEST ====="
        npm test

        echo "===== APPLICATION BUILD ====="
        npm run build

        echo "===== AWS IDENTITY ====="
        aws sts get-caller-identity --region "$AWS_REGION"

        echo "===== ECR REPOSITORY ====="
        aws ecr describe-repositories \
          --region "$AWS_REGION" \
          --repository-names "$ECR_REPOSITORY" \
          --output json

        echo "===== ECR LOGIN ====="
        aws ecr get-login-password --region "$AWS_REGION" |
          docker login --username AWS --password-stdin "$ECR_REGISTRY"

        echo "===== ARM64 BINfmt ====="
        docker run --privileged --rm \
          tonistiigi/binfmt:latest \
          --install arm64

        ARCH="$(docker run --rm --platform linux/arm64 arm64v8/alpine:latest uname -m)"
        echo "ARM64 architecture: $ARCH"

        [[ "$ARCH" == "aarch64" ]] || {
          echo "ERROR: ARM64 emulation failed"
          exit 1
        }

        echo "PRE_BUILD SUCCESS"

  build:
    commands:
      - |
        set -euo pipefail
        echo "========== BUILD / ECR =========="

        APP_DIR="${CODEBUILD_SRC_DIR}/agent-harness-clone"
        cd "$APP_DIR"

        IMAGE_TAG="$(printf '%s' "$CODEBUILD_RESOLVED_SOURCE_VERSION" | tr '[:upper:]' '[:lower:]')"
        IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

        echo "===== DOCKER BUILD ====="

        if ! docker build --platform linux/arm64 --tag "$IMAGE_URI" .; then
          echo "FAILED AT: DOCKER BUILD"
          exit 1
        fi

        IMAGE_PLATFORM="$(docker image inspect "$IMAGE_URI" --format '{{.Os}}/{{.Architecture}}')"
        echo "IMAGE_PLATFORM=$IMAGE_PLATFORM"

        [[ "$IMAGE_PLATFORM" == "linux/arm64" ]] || {
          echo "ERROR: Expected linux/arm64, got $IMAGE_PLATFORM"
          exit 1
        }

        echo "===== ECR PUSH ====="

        if ! docker push "$IMAGE_URI"; then
          echo "FAILED AT: ECR PUSH"
          exit 1
        fi

        IMAGE_DIGEST="$(
          aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text
        )"

        echo "IMAGE_DIGEST=$IMAGE_DIGEST"

        [[ "$IMAGE_DIGEST" == sha256:* ]] || {
          echo "ERROR: Invalid ECR digest"
          exit 1
        }

        echo "BUILD / ECR SUCCESS"

  post_build:
    commands:
      - |
        set -euo pipefail
        echo "========== AGENTCORE DEPLOYMENT =========="

        APP_DIR="${CODEBUILD_SRC_DIR}/agent-harness-clone"
        cd "$APP_DIR"

        IMAGE_TAG="$(printf '%s' "$CODEBUILD_RESOLVED_SOURCE_VERSION" | tr '[:upper:]' '[:lower:]')"
        IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

        TMP_DIR="$(mktemp -d)"
        trap 'rm -rf "$TMP_DIR"' EXIT

        CURRENT="$TMP_DIR/current.json"
        REQUEST="$TMP_DIR/request.json"
        RESPONSE="$TMP_DIR/response.json"
        ERROR_FILE="$TMP_DIR/error.txt"

        echo "===== GET AGENTCORE RUNTIME ====="

        if ! aws bedrock-agentcore-control get-agent-runtime \
          --region "$AWS_REGION" \
          --agent-runtime-id "$AGENTCORE_RUNTIME_ID" \
          --output json > "$CURRENT" 2> "$ERROR_FILE"; then
          echo "FAILED AT: GET AGENTCORE RUNTIME"
          cat "$ERROR_FILE"
          exit 1
        fi

        ROLE_ARN="$(jq -r '.roleArn // empty' "$CURRENT")"
        NETWORK_MODE="$(jq -r '.networkConfiguration.networkMode // empty' "$CURRENT")"

        [[ -n "$ROLE_ARN" ]] || { echo "FAILED AT: ROLE ARN"; exit 1; }
        [[ -n "$NETWORK_MODE" ]] || { echo "FAILED AT: NETWORK MODE"; exit 1; }

        echo "GET RUNTIME SUCCESS"
        echo "ROLE ARN: $ROLE_ARN"
        echo "NETWORK MODE: $NETWORK_MODE"

        echo "===== VALIDATE CODEBUILD ENVIRONMENT ====="

        REQUIRED_RUNTIME_VARS=(
          PLATFORM_MONGODB_URI
          PLATFORM_CONTENT_S3_REGION
          AGENT_LOG_GROUP
          AWS_REGION
          AGENT_LOG_LEVEL
          AGENT_SESSION_MAX_BYTES
          AGENT_SESSION_TTL_SECONDS
          AGENT_SESSION_STORE
          AGENT_SESSION_DIR
          AGENT_SESSION_S3_BUCKET
          AGENT_SESSION_S3_PREFIX
          AGENT_S3_ARTIFACT_PREFIX
          AGENT_SESSION_S3_REQUEST_TIMEOUT_MS
          COMPACTION_MODEL
          COMPACTION_MODEL_ENDPOINT
        )

        for VAR_NAME in "${REQUIRED_RUNTIME_VARS[@]}"; do
          if [[ -z "${!VAR_NAME:-}" ]]; then
            echo "ERROR: Missing CodeBuild environment variable: $VAR_NAME"
            exit 1
          fi
        done

        echo "All required runtime variables are present."

        echo "===== BUILD AGENTCORE REQUEST ====="

        jq -n \
          --arg runtimeId "$AGENTCORE_RUNTIME_ID" \
          --arg image "$IMAGE_URI" \
          --arg networkMode "$NETWORK_MODE" \
          --arg roleArn "$ROLE_ARN" \
          --arg mongodbUri "$PLATFORM_MONGODB_URI" \
          --arg contentS3Region "$PLATFORM_CONTENT_S3_REGION" \
          --arg logGroup "$AGENT_LOG_GROUP" \
          --arg awsRegion "$AWS_REGION" \
          --arg logLevel "$AGENT_LOG_LEVEL" \
          --arg maxBytes "$AGENT_SESSION_MAX_BYTES" \
          --arg ttl "$AGENT_SESSION_TTL_SECONDS" \
          --arg sessionStore "$AGENT_SESSION_STORE" \
          --arg sessionDir "$AGENT_SESSION_DIR" \
          --arg sessionBucket "$AGENT_SESSION_S3_BUCKET" \
          --arg sessionPrefix "$AGENT_SESSION_S3_PREFIX" \
          --arg artifactPrefix "$AGENT_S3_ARTIFACT_PREFIX" \
          --arg requestTimeout "$AGENT_SESSION_S3_REQUEST_TIMEOUT_MS" \
          --arg compactionModel "$COMPACTION_MODEL" \
          --arg compactionEndpoint "$COMPACTION_MODEL_ENDPOINT" \
          --arg tavilyApiKey "${TAVILY_API_KEY:-}" \
          '{
            agentRuntimeId: $runtimeId,
            agentRuntimeArtifact: {
              containerConfiguration: {
                containerUri: $image
              }
            },
            networkConfiguration: {
              networkMode: $networkMode
            },
            roleArn: $roleArn,
            environmentVariables: {
              PLATFORM_MONGODB_URI: $mongodbUri,
              PLATFORM_CONTENT_S3_REGION: $contentS3Region,
              AGENT_LOG_GROUP: $logGroup,
              AWS_REGION: $awsRegion,
              AGENT_LOG_LEVEL: $logLevel,
              AGENT_SESSION_MAX_BYTES: $maxBytes,
              AGENT_SESSION_TTL_SECONDS: $ttl,
              AGENT_SESSION_STORE: $sessionStore,
              AGENT_SESSION_DIR: $sessionDir,
              AGENT_SESSION_S3_BUCKET: $sessionBucket,
              AGENT_SESSION_S3_PREFIX: $sessionPrefix,
              AGENT_S3_ARTIFACT_PREFIX: $artifactPrefix,
              AGENT_SESSION_S3_REQUEST_TIMEOUT_MS: $requestTimeout,
              COMPACTION_MODEL: $compactionModel,
              COMPACTION_MODEL_ENDPOINT: $compactionEndpoint
            }
          }
          + if $tavilyApiKey != "" then
              {environmentVariables: {TAVILY_API_KEY: $tavilyApiKey}}
            else
              {}
            end
          ' > "$REQUEST"

        REQUEST_ENV_COUNT="$(jq '.environmentVariables | length' "$REQUEST")"
        echo "AgentCore environment variable count: $REQUEST_ENV_COUNT"

        jq -e \
          '.agentRuntimeId and
           .agentRuntimeArtifact.containerConfiguration.containerUri and
           .networkConfiguration.networkMode and
           .roleArn and
           .environmentVariables.PLATFORM_MONGODB_URI and
           .environmentVariables.COMPACTION_MODEL' \
          "$REQUEST" >/dev/null || {
          echo "ERROR: AgentCore request validation failed"
          exit 1
        }

        # Never print REQUEST: it can contain TAVILY_API_KEY.
        echo "Request structure validated."

        echo "===== UPDATE AGENTCORE RUNTIME ====="

        if ! aws bedrock-agentcore-control update-agent-runtime \
          --region "$AWS_REGION" \
          --cli-input-json "file://$REQUEST" \
          --output json > "$RESPONSE" 2> "$ERROR_FILE"; then
          echo "FAILED AT: UPDATE AGENTCORE RUNTIME"
          echo "AWS ERROR:"
          cat "$ERROR_FILE"
          exit 1
        fi

        echo "UPDATE AGENTCORE RUNTIME SUCCESS"

        NEW_RUNTIME_VERSION="$(jq -r '.agentRuntimeVersion // empty' "$RESPONSE")"

        [[ -n "$NEW_RUNTIME_VERSION" ]] || {
          echo "ERROR: No agentRuntimeVersion returned"
          exit 1
        }

        echo "NEW_RUNTIME_VERSION=$NEW_RUNTIME_VERSION"

        echo "===== WAIT FOR RUNTIME READY ====="

        RUNTIME_STATUS=""

        for attempt in $(seq 1 120); do
          RUNTIME_JSON="$(
            aws bedrock-agentcore-control get-agent-runtime \
              --region "$AWS_REGION" \
              --agent-runtime-id "$AGENTCORE_RUNTIME_ID" \
              --agent-runtime-version "$NEW_RUNTIME_VERSION" \
              --output json
          )"

          RUNTIME_STATUS="$(printf '%s' "$RUNTIME_JSON" | jq -r '.status // empty')"

          echo "Runtime attempt $attempt/120: $RUNTIME_STATUS"

          if [[ "$RUNTIME_STATUS" == "READY" ]]; then
            break
          fi

          case "$RUNTIME_STATUS" in
            CREATE_FAILED|UPDATE_FAILED)
              echo "FAILED AT: AGENTCORE RUNTIME"
              echo "$RUNTIME_JSON" | jq .
              exit 1
              ;;
          esac

          sleep 5
        done

        [[ "$RUNTIME_STATUS" == "READY" ]] || {
          echo "FAILED AT: RUNTIME READY TIMEOUT"
          exit 1
        }

        echo "RUNTIME READY"

        echo "===== VERIFY IMAGE ====="

        DEPLOYED_URI="$(
          aws bedrock-agentcore-control get-agent-runtime \
            --region "$AWS_REGION" \
            --agent-runtime-id "$AGENTCORE_RUNTIME_ID" \
            --agent-runtime-version "$NEW_RUNTIME_VERSION" \
            --query 'agentRuntimeArtifact.containerConfiguration.containerUri' \
            --output text
        )"

        echo "Expected: $IMAGE_URI"
        echo "Deployed: $DEPLOYED_URI"

        [[ "$DEPLOYED_URI" == "$IMAGE_URI" ]] || {
          echo "FAILED AT: DEPLOYED IMAGE VERIFICATION"
          exit 1
        }

        echo "IMAGE VERIFIED"

        echo "===== VERIFY AGENTCORE ENVIRONMENT ====="

        DEPLOYED_ENV_COUNT="$(
          aws bedrock-agentcore-control get-agent-runtime \
            --region "$AWS_REGION" \
            --agent-runtime-id "$AGENTCORE_RUNTIME_ID" \
            --agent-runtime-version "$NEW_RUNTIME_VERSION" \
            --query 'length(environmentVariables)' \
            --output text
        )"

        echo "Requested environment variables: $REQUEST_ENV_COUNT"
        echo "Deployed environment variables: $DEPLOYED_ENV_COUNT"

        [[ "$DEPLOYED_ENV_COUNT" -ge "$REQUEST_ENV_COUNT" ]] || {
          echo "ERROR: AgentCore environment variable count is lower than requested"
          exit 1
        }

        echo "AGENTCORE ENVIRONMENT VERIFIED"

        echo "===== WAIT FOR DEFAULT ENDPOINT ====="

        ENDPOINT_STATUS=""
        LIVE_VERSION=""

        for attempt in $(seq 1 120); do
          ENDPOINT_JSON="$(
            aws bedrock-agentcore-control get-agent-runtime-endpoint \
              --region "$AWS_REGION" \
              --agent-runtime-id "$AGENTCORE_RUNTIME_ID" \
              --endpoint-name DEFAULT \
              --output json
          )"

          ENDPOINT_STATUS="$(printf '%s' "$ENDPOINT_JSON" | jq -r '.status // empty')"
          LIVE_VERSION="$(printf '%s' "$ENDPOINT_JSON" | jq -r '.liveVersion // empty')"

          echo "Endpoint attempt $attempt/120: status=$ENDPOINT_STATUS liveVersion=$LIVE_VERSION"

          if [[ "$ENDPOINT_STATUS" == "READY" &&
                "$LIVE_VERSION" == "$NEW_RUNTIME_VERSION" ]]; then
            break
          fi

          case "$ENDPOINT_STATUS" in
            CREATE_FAILED|UPDATE_FAILED|DELETING)
              echo "FAILED AT: DEFAULT ENDPOINT"
              echo "$ENDPOINT_JSON" | jq .
              exit 1
              ;;
          esac

          sleep 5
        done

        if [[ "$ENDPOINT_STATUS" != "READY" ||
              "$LIVE_VERSION" != "$NEW_RUNTIME_VERSION" ]]; then
          echo "FAILED AT: DEFAULT ENDPOINT VERSION"
          echo "Expected: $NEW_RUNTIME_VERSION"
          echo "Actual: $LIVE_VERSION"
          exit 1
        fi

        echo "=========================================="
        echo "AGENTCORE DEPLOYMENT SUCCESSFUL"
        echo "=========================================="
        echo "Image: $IMAGE_URI"
        echo "Runtime: $AGENTCORE_RUNTIME_ID"
        echo "Version: $NEW_RUNTIME_VERSION"
        echo "Runtime status: $RUNTIME_STATUS"
        echo "Environment variables: $DEPLOYED_ENV_COUNT"
        echo "Endpoint: DEFAULT"
        echo "Endpoint status: $ENDPOINT_STATUS"
        echo "Live version: $LIVE_VERSION"
        echo "=========================================="

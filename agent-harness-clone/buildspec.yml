version: 0.2

env:
  shell: bash
  variables:
    AWS_PAGER: ""
    AWS_DEFAULT_OUTPUT: json
    DOCKER_BUILDKIT: "1"
    AWS_REGION: "us-east-1"
    ECR_REGISTRY: "498341975048.dkr.ecr.us-east-1.amazonaws.com"
    ECR_REPOSITORY: "agentcore"
    AGENTCORE_RUNTIME_ID: "agent_harness-Jax4VH7YQj"

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - |
        set -euo pipefail
        echo "=== INSTALL ==="
        command -v aws >/dev/null || { echo "ERROR: AWS CLI is required" >&2; exit 1; }
        command -v docker >/dev/null || { echo "ERROR: Docker is required" >&2; exit 1; }
        command -v python3 >/dev/null || { echo "ERROR: Python 3 is required" >&2; exit 1; }
        APP_DIR="${CODEBUILD_SRC_DIR}/agent-harness-clone"
        if [[ ! -d "$APP_DIR" ]]; then echo "ERROR: Missing $APP_DIR" >&2; ls -la "$CODEBUILD_SRC_DIR" >&2; exit 1; fi
        cd "$APP_DIR"
        echo "Application directory: $(pwd)"
        [[ -f package.json ]] || { echo "ERROR: package.json not found" >&2; exit 1; }
        [[ -f package-lock.json ]] || { echo "ERROR: package-lock.json not found" >&2; exit 1; }
        echo "Node: $(node --version)"
        echo "npm: $(npm --version)"
        npm ci --no-audit --no-fund
        echo "npm ci completed successfully"

  pre_build:
    commands:
      - |
        set -euo pipefail
        echo "=== PRE_BUILD ==="
        APP_DIR="${CODEBUILD_SRC_DIR}/agent-harness-clone"
        cd "$APP_DIR"
        : "${AWS_REGION:?AWS_REGION must be set}"
        : "${ECR_REGISTRY:?ECR_REGISTRY must be set}"
        : "${ECR_REPOSITORY:?ECR_REPOSITORY must be set}"
        : "${AGENTCORE_RUNTIME_ID:?AGENTCORE_RUNTIME_ID must be set}"
        : "${CODEBUILD_RESOLVED_SOURCE_VERSION:?CODEBUILD_RESOLVED_SOURCE_VERSION must be set}"
        if [[ ! "$AGENTCORE_RUNTIME_ID" =~ ^[a-zA-Z][a-zA-Z0-9_]{0,99}-[a-zA-Z0-9]{10}$ ]]; then echo "ERROR: Invalid AgentCore Runtime ID: $AGENTCORE_RUNTIME_ID" >&2; exit 1; fi
        IMAGE_TAG="$(printf "%s" "$CODEBUILD_RESOLVED_SOURCE_VERSION" | tr "[:upper:]" "[:lower:]")"
        IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
        echo "Image URI: $IMAGE_URI"
        npm run typecheck
        npm test
        npm run build
        echo "Checking ECR repository..."
        aws ecr describe-repositories --region "$AWS_REGION" --repository-names "$ECR_REPOSITORY" --query "repositories[0].repositoryUri" --output text
        echo "Logging into ECR..."
        aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
        echo "Installing ARM64 emulation..."
        docker run --privileged --rm tonistiigi/binfmt:latest --install arm64
        ARCH="$(docker run --rm --platform linux/arm64 arm64v8/alpine:latest uname -m)"
        echo "ARM64 test: $ARCH"
        [[ "$ARCH" == "aarch64" ]] || { echo "ERROR: ARM64 emulation is not working" >&2; exit 1; }
        echo "ARM64 emulation verified"

  build:
    commands:
      - |
        set -euo pipefail
        echo "=== BUILD / DEPLOY ==="
        APP_DIR="${CODEBUILD_SRC_DIR}/agent-harness-clone"
        cd "$APP_DIR"
        IMAGE_TAG="$(printf "%s" "$CODEBUILD_RESOLVED_SOURCE_VERSION" | tr "[:upper:]" "[:lower:]")"
        IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
        echo "Building ARM64 image: $IMAGE_URI"
        docker build --platform linux/arm64 --tag "$IMAGE_URI" .
        IMAGE_PLATFORM="$(docker image inspect "$IMAGE_URI" --format "{{.Os}}/{{.Architecture}}")"
        echo "Image platform: $IMAGE_PLATFORM"
        [[ "$IMAGE_PLATFORM" == "linux/arm64" ]] || { echo "ERROR: Wrong image platform" >&2; exit 1; }
        docker push "$IMAGE_URI"
        IMAGE_DIGEST="$(aws ecr describe-images --region "$AWS_REGION" --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$IMAGE_TAG" --query "imageDetails[0].imageDigest" --output text)"
        [[ "$IMAGE_DIGEST" == sha256:* ]] || { echo "ERROR: Invalid ECR digest" >&2; exit 1; }
        echo "ECR digest: $IMAGE_DIGEST"
        DEPLOY_TMP="$(mktemp -d)"
        trap "rm -rf \"$DEPLOY_TMP\"" EXIT
        CURRENT_RUNTIME="$DEPLOY_TMP/current-runtime.json"
        UPDATE_INPUT="$DEPLOY_TMP/update-runtime.json"
        aws bedrock-agentcore-control get-agent-runtime --region "$AWS_REGION" --agent-runtime-id "$AGENTCORE_RUNTIME_ID" > "$CURRENT_RUNTIME"
        python3 - "$CURRENT_RUNTIME" "$UPDATE_INPUT" "$AGENTCORE_RUNTIME_ID" "$IMAGE_URI" <<'PY'
        import json, hashlib, sys
        source_path, output_path, runtime_id, image_uri = sys.argv[1:5]
        with open(source_path, encoding="utf-8") as f: current = json.load(f)
        role_arn = current.get("roleArn")
        if not role_arn: raise SystemExit("ERROR: Existing runtime has no roleArn")
        update = {"agentRuntimeId": runtime_id, "agentRuntimeArtifact": {"containerConfiguration": {"containerUri": image_uri}}, "roleArn": role_arn, "clientToken": "codebuild-" + hashlib.sha256(f"{runtime_id}:{image_uri}".encode()).hexdigest()}
        for field in ("networkConfiguration","description","authorizerConfiguration","requestHeaderConfiguration","protocolConfiguration","lifecycleConfiguration","metadataConfiguration","environmentVariables","filesystemConfigurations","capacityProviderConfiguration"):
            if field in current: update[field] = current[field]
        with open(output_path, "w", encoding="utf-8") as f: json.dump(update, f)
        print("AgentCore update input generated")
        PY
        echo "Creating AgentCore Runtime version..."
        NEW_RUNTIME_VERSION="$(aws bedrock-agentcore-control update-agent-runtime --region "$AWS_REGION" --cli-input-json "file://$UPDATE_INPUT" --query agentRuntimeVersion --output text)"
        [[ "$NEW_RUNTIME_VERSION" =~ ^[1-9][0-9]{0,4}$ ]] || { echo "ERROR: Invalid runtime version: $NEW_RUNTIME_VERSION" >&2; exit 1; }
        echo "Runtime version: $NEW_RUNTIME_VERSION"
        RUNTIME_STATUS=""
        for attempt in $(seq 1 120); do
          RUNTIME_STATUS="$(aws bedrock-agentcore-control get-agent-runtime --region "$AWS_REGION" --agent-runtime-id "$AGENTCORE_RUNTIME_ID" --agent-runtime-version "$NEW_RUNTIME_VERSION" --query status --output text)"
          echo "Attempt $attempt/120 - Runtime: $RUNTIME_STATUS"
          [[ "$RUNTIME_STATUS" == "READY" ]] && break
          case "$RUNTIME_STATUS" in CREATE_FAILED|UPDATE_FAILED|DELETING) echo "ERROR: Runtime deployment failed: $RUNTIME_STATUS" >&2; exit 1;; esac
          sleep 5
        done
        [[ "$RUNTIME_STATUS" == "READY" ]] || { echo "ERROR: Runtime did not become READY" >&2; exit 1; }
        DEPLOYED_URI="$(aws bedrock-agentcore-control get-agent-runtime --region "$AWS_REGION" --agent-runtime-id "$AGENTCORE_RUNTIME_ID" --agent-runtime-version "$NEW_RUNTIME_VERSION" --query "agentRuntimeArtifact.containerConfiguration.containerUri" --output text)"
        [[ "$DEPLOYED_URI" == "$IMAGE_URI" ]] || { echo "ERROR: Deployed image mismatch" >&2; echo "Expected: $IMAGE_URI" >&2; echo "Actual: $DEPLOYED_URI" >&2; exit 1; }
        ENDPOINT_STATUS=""
        LIVE_VERSION=""
        for attempt in $(seq 1 120); do
          read -r ENDPOINT_STATUS LIVE_VERSION < <(aws bedrock-agentcore-control get-agent-runtime-endpoint --region "$AWS_REGION" --agent-runtime-id "$AGENTCORE_RUNTIME_ID" --endpoint-name DEFAULT --query "[status,liveVersion]" --output text)
          echo "Endpoint attempt $attempt/120 - Status: $ENDPOINT_STATUS - Live version: $LIVE_VERSION"
          [[ "$ENDPOINT_STATUS" == "READY" && "$LIVE_VERSION" == "$NEW_RUNTIME_VERSION" ]] && break
          case "$ENDPOINT_STATUS" in CREATE_FAILED|UPDATE_FAILED|DELETING) echo "ERROR: DEFAULT endpoint failed: $ENDPOINT_STATUS" >&2; exit 1;; esac
          sleep 5
        done
        [[ "$ENDPOINT_STATUS" == "READY" && "$LIVE_VERSION" == "$NEW_RUNTIME_VERSION" ]] || { echo "ERROR: DEFAULT endpoint did not become ready on expected version" >&2; exit 1; }
        echo "=========================================="
        echo "DEPLOYMENT SUCCESSFUL"
        echo "Image: $IMAGE_URI"
        echo "Digest: $IMAGE_DIGEST"
        echo "Runtime: $AGENTCORE_RUNTIME_ID"
        echo "Version: $NEW_RUNTIME_VERSION"
        echo "Endpoint: $ENDPOINT_STATUS"
        echo "Live version: $LIVE_VERSION"
        echo "=========================================="

  post_build:
    commands:
      - echo "POST_BUILD completed."
